name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install pipenv
      - run: pipenv install --dev --deploy
      - run: pipenv run black --check main.py test_main.py
      - run: pipenv run pytest

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::033667237508:role/github-actions-bigben
          aws-region: us-east-1
      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          use-installer: true
      - run: pip install pipenv
      - run: pipenv requirements > requirements.txt
      - name: Ensure SAM artifact bucket
        run: aws s3api head-bucket --bucket bigben-sam-artifacts-033667237508 2>/dev/null || aws s3 mb s3://bigben-sam-artifacts-033667237508 --region us-east-1
      - run: sam build --use-container
      - run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --stack-name big-ben --s3-bucket bigben-sam-artifacts-033667237508 --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND --parameter-overrides MastodonAccessToken=${{ secrets.MASTODON_ACCESS_TOKEN }} MastodonBaseUrl=${{ secrets.MASTODON_BASE_URL }}
