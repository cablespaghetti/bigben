[settings]
lockfile = false

[tools]
python = "3.14"
uv = "0.13"
awscli = "2.39"
aws-sam-cli = "1.172.1"

[env]
AWS_REGION = "eu-west-1"
SAM_ARTIFACT_BUCKET = "big-ben-sam-artifacts-033667237508"

[tasks.install]
description = "Install project dependencies from uv.lock"
run = "uv sync --locked"

[tasks.lint]
description = "Check formatting with Black"
depends = ["install"]
run = "uv run black --check main.py test_main.py"

[tasks.test]
description = "Run the test suite"
depends = ["install"]
run = "uv run python -m unittest -v"

[tasks.check]
description = "Run lint and tests"
depends = ["lint", "test"]
run = "echo 'All checks passed'"

[tasks.requirements]
description = "Export locked production requirements for SAM"
run = "uv export --locked --no-dev --no-hashes --output-file requirements.txt"

[tasks.build]
description = "Build the Lambda package with SAM"
depends = ["requirements"]
run = "sam build"

[tasks.ensure-bucket]
description = "Create the SAM artifact bucket if it does not exist"
run = 'aws s3api head-bucket --bucket "$SAM_ARTIFACT_BUCKET" 2>/dev/null || aws s3 mb "s3://$SAM_ARTIFACT_BUCKET"'

[tasks.deploy]
description = "Deploy the Lambda stack with SAM"
depends = ["build", "ensure-bucket"]
run = '''
sam deploy \
  --no-confirm-changeset \
  --no-fail-on-empty-changeset \
  --stack-name big-ben \
  --s3-bucket "$SAM_ARTIFACT_BUCKET" \
  --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
  --parameter-overrides \
    MastodonAccessToken="$MASTODON_ACCESS_TOKEN" \
    MastodonBaseUrl="$MASTODON_BASE_URL"
'''
